version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: openproject_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openproject}
      POSTGRES_USER: ${POSTGRES_USER:-openproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openproject123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    ports:
      - "${POSTGRES_HOST_PORT:-54333}:5432"
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: openproject_memcached
    restart: unless-stopped

  openproject:
    image: openproject/community:13.4.1
    container_name: openproject_app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-openproject}:${POSTGRES_PASSWORD:-openproject123}@postgres:5432/${POSTGRES_DB:-openproject}"
      SECRET_KEY_BASE: "${OPENPROJECT_SECRET_KEY_BASE}"
      OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOSTNAME:-localhost:8686}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
      OPENPROJECT_CACHE__STORE: "memcache"
      OPENPROJECT_CACHE__MEMCACHE__SERVER: "memcached:11211"
      SMTP_ADDRESS: "${SMTP_ADDRESS}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_DOMAIN: "${OPENPROJECT_HOSTNAME}"
      SMTP_AUTHENTICATION: "plain"
      SMTP_USER_NAME: "${SMTP_USER_NAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_ENABLE__STARTTLS__AUTO: "true"
    depends_on:
      - postgres
      - memcached
    ports:
      - "${OPENPROJECT_HOST_PORT:-8686}:80"
    volumes:
      - ./openproject-data:/var/lib/openproject
    restart: unless-stopped
    
  ngrok:
    image: ngrok/ngrok:latest
    container_name: openproject_ngrok
    command: >
      start --config /etc/ngrok.yml web_service
    environment:
      - NGROK_AUTHTOKEN=2qccQC6K5GXW61ALip9dVHDGfak_7yCTeTnFmXFQbtZhPkjyV
      - OPENPROJECT_HTTPS=false               # nếu bạn muốn HTTP (đã có trong .env)
    volumes:
      - ./ngrok2.yml:/etc/ngrok.yml:ro        # gắn file cấu hình của bạn
    extra_hosts:
      - "host.docker.internal:host-gateway"   # cho phép container ngrok truy cập localhost của host
    restart: unless-stopped
    depends_on:
      - openproject                           # chắc chắn OpenProject đã khởi động trước